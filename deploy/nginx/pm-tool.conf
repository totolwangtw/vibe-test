# =============================================================================
# 项目管理工具 - Nginx 反向代理配置（HTTPS）
# =============================================================================
# 适用场景：FastAPI 后端默认监听 127.0.0.1:8000，Nginx 在前置提供 HTTPS 入口。
#
# 部署位置（按需选择其一）：
#   - Linux:   /etc/nginx/conf.d/pm-tool.conf   或  /etc/nginx/sites-available/pm-tool.conf
#   - Windows: <nginx安装目录>/conf/pm-tool.conf  并在 nginx.conf 的 http{} 内 include 它
#
# 启用：nginx -t && nginx -s reload
# =============================================================================

# ---------- 顶层公共配置（可放到 nginx.conf 的 http{} 内，也可保留在此）----------
# gzip 压缩，加速传输
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_vary on;

# 上传附件大小限制（按需调整，富文本图片/附件可能较大）
client_max_body_size 100m;

# 保持后端长连接，减少连接开销
proxy_http_version 1.1;
proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# ---------- 1) HTTP 80 -> 强制跳转 HTTPS ----------
server {
    listen 80;
    # IPv6（如需）
    # listen [::]:80;

    # 替换为你的域名或 IP；本地/局域网可用 _
    server_name _;

    # ACME http-01 校验放行（如使用 Let's Encrypt 自动续签）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 2) HTTPS 443 反向代理 ----------
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # IPv6（如需）

    # 替换为你的域名或 IP；本地/局域网可用 _
    server_name _;

    # ----- SSL 证书路径 -----
    # 方式 A：自签名证书（本地/局域网，详见 self-signed-cert.sh）
    ssl_certificate     /etc/nginx/ssl/pm-tool.crt;
    ssl_certificate_key /etc/nginx/ssl/pm-tool.key;

    # 方式 B：Let's Encrypt（公网域名，certbot 自动申请）
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ----- TLS 安全参数 -----
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # HSTS：强制浏览器后续走 HTTPS（仅公网长期部署建议开启）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- 反向代理到 FastAPI（127.0.0.1:8000）-----
    location / {
        proxy_pass http://127.0.0.1:8000;

        # 透传 Host / 真实客户端 IP / 协议，便于后端识别
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE 升级支持（富文本协作、长连接等场景）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 代理时不缓冲（流式响应、上传更稳定）
        proxy_buffering off;
    }

    # ----- 静态资源缓存（前端 assets 已带 hash，可长期缓存）-----
    location /assets/ {
        proxy_pass http://127.0.0.1:8000/assets/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- 上传/下载接口单独放大超时与体积 -----
    location ~ ^/api/(attachments|tasks/.+/attachments) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# WebSocket Connection 升级映射（需放在 http{} 上下文；若已定义可删除）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
